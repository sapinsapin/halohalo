<text x="64" y="47" font-size="16" fill="#90b8d5" font-weight="700" letter-spacing="2.5">SAPINSAPIN / HALOHALO</text><text x="64" y="108" font-size="57" fill="#ffffff" font-weight="800" letter-spacing="1">CHIKA</text><text x="285" y="105" font-size="35" fill="#ffffff" font-weight="700" >Everyday speech. Reusable datasets.</text><text x="64" y="151" font-size="23" fill="#c5d6e5" font-weight="400" >A traceable path from source audio to Philippine-language speech data.</text><rect x="1160" y="34" width="276" height="135" rx="18" fill="#1a3152" stroke="#345170" /><text x="1182" y="81" font-size="43" fill="#67e0cd" font-weight="700" >1,250 h</text><text x="1182" y="111" font-size="17" fill="#e3eef8" font-weight="700" >TARGET · 250 h × 5 groups</text><text x="1182" y="141" font-size="16" fill="#b9cce0" font-weight="400" >Not current achieved volume</text><rect x="64" y="183" width="218" height="34" rx="17" fill="#1b3455" stroke="#36516e" /><text x="173.0" y="206" font-size="17" fill="#e0eef8" font-weight="600" text-anchor="middle">Filipino / Taglish</text><rect x="294" y="183" width="164" height="34" rx="17" fill="#1b3455" stroke="#36516e" /><text x="376.0" y="206" font-size="17" fill="#e0eef8" font-weight="600" text-anchor="middle">Hiligaynon</text><rect x="470" y="183" width="145" height="34" rx="17" fill="#1b3455" stroke="#36516e" /><text x="542.5" y="206" font-size="17" fill="#e0eef8" font-weight="600" text-anchor="middle">Cebuano</text><rect x="627" y="183" width="147" height="34" rx="17" fill="#1b3455" stroke="#36516e" /><text x="700.5" y="206" font-size="17" fill="#e0eef8" font-weight="600" text-anchor="middle">Bikolano</text><rect x="786" y="183" width="137" height="34" rx="17" fill="#1b3455" stroke="#36516e" /><text x="854.5" y="206" font-size="17" fill="#e0eef8" font-weight="600" text-anchor="middle">Ilocano</text><text x="64" y="292" font-size="23" fill="#182c49" font-weight="700" letter-spacing="1">THE BULK CURATION WORKFLOW</text><text x="1436" y="291" font-size="17" fill="#60758e" font-weight="400" text-anchor="end">Implemented stages · bounded live validation</text><rect x="64" y="328" width="212" height="286" rx="16" fill="#ffffff" stroke="#d8e2ed" filter="url(#shadow)"/><rect x="65" y="329" width="210" height="6" rx="3" fill="#2389a2" stroke="none" /><text x="84" y="371" font-size="21" fill="#2389a2" font-weight="700" >01</text><g class="icon" stroke="#2389a2" transform="translate(223 350)"><circle cx="13" cy="13" r="9"/><path d="M20 20L29 29M7 13h3l2-4 3 9 2-5h3"/></g><text x="82" y="422" font-size="28" fill="#182c49" font-weight="700" >Discover</text><text x="82" y="464" font-size="17" fill="#425974" font-weight="400" >RSS &amp; podcasts</text><text x="82" y="495" font-size="17" fill="#425974" font-weight="400" >Videos &amp; radio</text><text x="82" y="526" font-size="17" fill="#425974" font-weight="400" >PLD imports</text><path d="M82 550L258 550" fill="none" stroke="#e5ebf2" stroke-width="2"  /><text x="170" y="582" font-size="14" fill="#2389a2" font-weight="600" text-anchor="middle">Keep source evidence</text><path d="M279 473L294 473" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><rect x="296" y="328" width="212" height="286" rx="16" fill="#ffffff" stroke="#d8e2ed" filter="url(#shadow)"/><rect x="297" y="329" width="210" height="6" rx="3" fill="#2389a2" stroke="none" /><text x="316" y="371" font-size="21" fill="#2389a2" font-weight="700" >02</text><g class="icon" stroke="#2389a2" transform="translate(455 350)"><path d="M16 2v19m-7-7 7 7 7-7M3 22v7h26v-7"/></g><text x="314" y="422" font-size="28" fill="#182c49" font-weight="700" >Acquire</text><text x="314" y="464" font-size="17" fill="#425974" font-weight="400" >Resumable downloads</text><text x="314" y="495" font-size="17" fill="#425974" font-weight="400" >Media checks + SHA256</text><text x="314" y="526" font-size="17" fill="#425974" font-weight="400" >Source + rights ledger</text><path d="M314 550L490 550" fill="none" stroke="#e5ebf2" stroke-width="2"  /><text x="402" y="582" font-size="14" fill="#2389a2" font-weight="600" text-anchor="middle">Retries + disk floors</text><path d="M511 473L526 473" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><rect x="528" y="328" width="212" height="286" rx="16" fill="#ffffff" stroke="#d8e2ed" filter="url(#shadow)"/><rect x="529" y="329" width="210" height="6" rx="3" fill="#138f86" stroke="none" /><text x="548" y="371" font-size="21" fill="#138f86" font-weight="700" >03</text><g class="icon" stroke="#138f86" transform="translate(687 350)"><path d="M3 10h26M3 24h26M10 5v10M23 19v10"/><circle cx="10" cy="10" r="3" fill="#fff"/><circle cx="23" cy="24" r="3" fill="#fff"/></g><text x="546" y="422" font-size="28" fill="#182c49" font-weight="700" >Prepare</text><text x="546" y="464" font-size="17" fill="#425974" font-weight="400" >16 kHz mono audio</text><text x="546" y="495" font-size="17" fill="#425974" font-weight="400" >VAD candidates ≤ 27 s</text><text x="546" y="526" font-size="17" fill="#425974" font-weight="400" >Exact source offsets</text><path d="M546 550L722 550" fill="none" stroke="#e5ebf2" stroke-width="2"  /><text x="634" y="582" font-size="14" fill="#138f86" font-weight="600" text-anchor="middle">VAD ≠ verified speech</text><path d="M743 473L758 473" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><rect x="760" y="328" width="212" height="286" rx="16" fill="#ffffff" stroke="#d8e2ed" filter="url(#shadow)"/><rect x="761" y="329" width="210" height="6" rx="3" fill="#6373cc" stroke="none" /><text x="780" y="371" font-size="21" fill="#6373cc" font-weight="700" >04</text><g class="icon" stroke="#6373cc" transform="translate(919 350)"><path d="M4 3h24v19H14l-8 7v-7H4zM10 9v7m6-10v13m6-10v7"/></g><text x="778" y="422" font-size="28" fill="#182c49" font-weight="700" >Transcribe</text><text x="778" y="464" font-size="17" fill="#425974" font-weight="400" >Boses ASR</text><text x="778" y="495" font-size="17" fill="#425974" font-weight="400" >Hil + Fil routes checked</text><text x="778" y="526" font-size="17" fill="#425974" font-weight="400" >Raw events + cache</text><path d="M778 550L954 550" fill="none" stroke="#e5ebf2" stroke-width="2"  /><text x="866" y="582" font-size="14" fill="#6373cc" font-weight="600" text-anchor="middle">Other routes unverified</text><path d="M975 473L990 473" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><rect x="992" y="328" width="212" height="286" rx="16" fill="#ffffff" stroke="#d8e2ed" filter="url(#shadow)"/><rect x="993" y="329" width="210" height="6" rx="3" fill="#6373cc" stroke="none" /><text x="1012" y="371" font-size="21" fill="#6373cc" font-weight="700" >05</text><g class="icon" stroke="#6373cc" transform="translate(1151 350)"><path d="M4 3h17v7M4 3v26h24V17M10 12h6M10 18h4M17 22l2-7 9-9 5 5-9 9z"/></g><text x="1010" y="422" font-size="28" fill="#182c49" font-weight="700" >Review</text><text x="1010" y="464" font-size="17" fill="#425974" font-weight="400" >LLM plausibility check</text><text x="1010" y="495" font-size="17" fill="#425974" font-weight="400" >Keep code-switching</text><text x="1010" y="526" font-size="17" fill="#425974" font-weight="400" >Bind review to hashes</text><path d="M1010 550L1186 550" fill="none" stroke="#e5ebf2" stroke-width="2"  /><text x="1098" y="582" font-size="14" fill="#6373cc" font-weight="600" text-anchor="middle">Text review ≠ listening</text><path d="M1207 473L1222 473" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><rect x="1224" y="328" width="212" height="286" rx="16" fill="#ffffff" stroke="#d8e2ed" filter="url(#shadow)"/><rect x="1225" y="329" width="210" height="6" rx="3" fill="#138f86" stroke="none" /><text x="1244" y="371" font-size="21" fill="#138f86" font-weight="700" >06</text><g class="icon" stroke="#138f86" transform="translate(1383 350)"><ellipse cx="16" cy="6" rx="13" ry="5"/><path d="M3 6v19c0 7 26 7 26 0V6M3 15c0 7 26 7 26 0"/></g><text x="1242" y="422" font-size="28" fill="#182c49" font-weight="700" >Publish</text><text x="1242" y="464" font-size="17" fill="#425974" font-weight="400" >PLD-style Parquet</text><text x="1242" y="495" font-size="17" fill="#425974" font-weight="400" >Embedded FLAC + text</text><text x="1242" y="526" font-size="17" fill="#425974" font-weight="400" >Private HF: Chika</text><path d="M1242 550L1418 550" fill="none" stroke="#e5ebf2" stroke-width="2"  /><text x="1330" y="582" font-size="14" fill="#138f86" font-weight="600" text-anchor="middle">Unverified curation set</text><rect x="64" y="650" width="1372" height="84" rx="16" fill="#e4edf6" stroke="#cfddea" /><g class="icon" stroke="#3b668d" transform="translate(90 674)"><path d="M16 0L30 6v10c0 9-14 16-14 16S2 25 2 16V6zM9 15l5 5 10-11"/></g><text x="140" y="684" font-size="22" fill="#234568" font-weight="700" >A recoverable record at every step</text><text x="140" y="714" font-size="18" fill="#425f7d" font-weight="400" >Manifests + caches  ·  source / model hashes  ·  verified backups  ·  interval-based coverage accounting</text><path d="M1330 614V635H1460V763H1190V784" fill="none" stroke="#bf8125" stroke-width="2" marker-end="url(#gold-arrow)"/><text x="1360" y="756" font-size="15" fill="#96641c" font-weight="600" text-anchor="end">promote only after review</text><rect x="944" y="790" width="492" height="300" rx="18" fill="#fffaf0" stroke="#e3c58e" /><text x="970" y="822" font-size="14" fill="#96641c" font-weight="700" >QUALITY GATES · NOT COMPLETE AT SCALE</text><text x="970" y="861" font-size="27" fill="#182c49" font-weight="700" >From drafts to training</text><circle cx="978" cy="893" r="4" fill="#c49446"/><text x="992" y="899" font-size="18" fill="#5a5260" font-weight="400" >Audio-verified transcript</text><circle cx="978" cy="924" r="4" fill="#c49446"/><text x="992" y="930" font-size="18" fill="#5a5260" font-weight="400" >Training permission + frozen splits</text><circle cx="978" cy="955" r="4" fill="#c49446"/><text x="992" y="961" font-size="18" fill="#5a5260" font-weight="400" >Language / music / overlap / dedup QC</text><rect x="970" y="997" width="207" height="47" rx="10" fill="#e2f2ec" stroke="#bfded2" /><rect x="1191" y="997" width="219" height="47" rx="10" fill="#e2f2ec" stroke="#bfded2" /><text x="1073.5" y="1027" font-size="22" fill="#1a6b59" font-weight="700" text-anchor="middle">ASR · 16 kHz</text><text x="1300.5" y="1027" font-size="22" fill="#1a6b59" font-weight="700" text-anchor="middle">TTS · 24 kHz</text><text x="970" y="1072" font-size="16" fill="#75644d" font-weight="400" >Private draft publication does not grant training rights.</text><rect x="64" y="790" width="850" height="300" rx="18" fill="#f0f2ff" stroke="#98a4de" stroke-width="1.5" stroke-dasharray="8 6"/><text x="90" y="822" font-size="14" fill="#5966a4" font-weight="700" >CONTRIBUTOR ROUTE · SEPARATE WORKSTREAM · IN DEVELOPMENT</text><text x="90" y="861" font-size="27" fill="#182c49" font-weight="700" >Contribute through your own assistant</text><rect x="90" y="890" width="242" height="103" rx="12" fill="#ffffff" stroke="#c7cef0" /><text x="211" y="930" font-size="21" fill="#435292" font-weight="700" text-anchor="middle">Voice website + MCP</text><text x="211" y="965" font-size="16" fill="#68749c" font-weight="400" text-anchor="middle">Contributor sign-in</text><rect x="352" y="890" width="242" height="103" rx="12" fill="#ffffff" stroke="#c7cef0" /><text x="473" y="930" font-size="21" fill="#435292" font-weight="700" text-anchor="middle">ChatGPT / Claude</text><text x="473" y="965" font-size="16" fill="#68749c" font-weight="400" text-anchor="middle">Client-produced transcript</text><rect x="614" y="890" width="242" height="103" rx="12" fill="#ffffff" stroke="#c7cef0" /><text x="735" y="930" font-size="21" fill="#435292" font-weight="700" text-anchor="middle">Scoped submission</text><text x="735" y="965" font-size="16" fill="#68749c" font-weight="400" text-anchor="middle">Same private Chika staging</text><path d="M333 942L350 942" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><path d="M595 942L612 942" fill="none" stroke="#70849b" stroke-width="2" marker-end="url(#arrow)" /><text x="90" y="1032" font-size="18" fill="#556285" font-weight="400" >Native-client ASR support must be checked, not assumed.</text><text x="90" y="1063" font-size="18" fill="#556285" font-weight="400" >Hugging Face credentials stay server-side; submissions remain unverified.</text><text x="64" y="1140" font-size="23" fill="#182c49" font-weight="700" >Preserve natural code-switching. Keep questions separate from transcripts.</text><text x="64" y="1175" font-size="20" fill="#62758c" font-weight="400" >Raw hours ≠ unique speech ≠ transcribed hours ≠ audio-verified hours.</text><text x="1436" y="1175" font-size="13" fill="#7d8ea3" font-weight="600" text-anchor="end">WORKFLOW OVERVIEW · NOV 2026</text></svg>
